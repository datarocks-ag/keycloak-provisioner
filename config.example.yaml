# Strategy: "update" (default) creates or updates resources.
#           "create" only creates if missing, skips existing.
# Set globally or per realm (realm strategy overrides global).
# strategy: "update"

# Master realm configuration (update-only, never created).
# masterRealm:
#   sslRequired: external  # "external", "all", or "none"
#   users:
#     - username: "admin-new"
#       password: "${ADMIN_PASSWORD}"
#       enabled: true
#       email: "admin@example.com"
#       firstName: "Admin"
#       lastName: "User"
#       roles:
#         realm:
#           - admin

realms:
  - realm: "my-realm"
    displayName: "My Realm"
    enabled: true
    sslRequired: "external"
    loginTheme: "keycloak"
    registrationAllowed: false
    resetPasswordAllowed: true

    clients:
      - clientId: "my-app"
        secret: "${MY_APP_CLIENT_SECRET}"
        name: "My Application"
        enabled: true
        publicClient: false
        protocol: "openid-connect"
        rootUrl: "https://myapp.example.com"
        baseUrl: "/"
        adminUrl: "https://myapp.example.com"
        redirectUris:
          - "https://myapp.example.com/*"
        webOrigins:
          - "https://myapp.example.com"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        bearerOnly: false
        consentRequired: false
        frontchannelLogout: false
        defaultClientScopes:
          - "web-origins"
          - "profile"
        optionalClientScopes:
          - "offline_access"
        attributes:
          "post.logout.redirect.uris": "+"
        protocolMappers:
          - name: "audience-mapper"
            protocol: "openid-connect"
            protocolMapper: "oidc-audience-mapper"
            consentRequired: false
            config:
              "included.client.audience": "my-app"
              "id.token.claim": "true"
              "access.token.claim": "true"
        clientRoles:
          - name: "admin"
            description: "Administrator role"
          - name: "user"
            description: "Regular user role"

      # Service account client with role assignments
      # - clientId: "my-service"
      #   serviceAccountsEnabled: true
      #   serviceAccountRoles:
      #     realm:
      #       - app-admin
      #     clients:
      #       another-client:
      #         - some-role

      # Token exchange (RFC 8693) requester client.
      # Enables the OAuth 2.0 Token Exchange grant so this client can exchange
      # its access token for a token targeting another client in the realm.
      # Requires a confidential client (publicClient not true, not bearer-only)
      # and Keycloak 26.2+.
      # - clientId: "exchange-service"
      #   publicClient: false
      #   secret: "${EXCHANGE_SERVICE_SECRET}"
      #   standardTokenExchangeEnabled: true

    roles:
      - name: "app-admin"
        description: "Application administrator"
      - name: "app-user"
        description: "Application user"

    # User management
    # users:
    #   - username: "service-admin"
    #     password: "${SERVICE_ADMIN_PASSWORD}"    # permanent password, reset on every run
    #     enabled: true
    #     email: "admin@example.com"
    #     firstName: "Service"
    #     lastName: "Admin"
    #     emailVerified: true
    #     roles:
    #       realm:
    #         - app-admin
    #       clients:
    #         my-app:
    #           - admin
    #
    #   # Use initialPassword instead of password for one-time setup.
    #   # Only set when the user is first created; ignored on subsequent runs.
    #   # The user must change the password on first login.
    #   - username: "new-user"
    #     initialPassword: "changeme"
    #     enabled: true
    #     email: "user@example.com"
