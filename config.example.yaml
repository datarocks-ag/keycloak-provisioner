# Strategy: "update" (default) creates or updates resources.
#           "create" only creates if missing, skips existing.
# Set globally or per realm (realm strategy overrides global).
# strategy: "update"

# Master realm configuration (update-only, never created).
# masterRealm:
#   sslRequired: external  # "external", "all", or "none"
#   users:
#     - username: "admin-new"
#       password: "${ADMIN_PASSWORD}"
#       enabled: true
#       email: "admin@example.com"
#       firstName: "Admin"
#       lastName: "User"
#       roles:
#         realm:
#           - admin

realms:
  - realm: "my-realm"
    displayName: "My Realm"
    enabled: true
    sslRequired: "external"
    loginTheme: "keycloak"
    registrationAllowed: false
    resetPasswordAllowed: true

    # Enable Keycloak Organizations for this realm (Keycloak 26+).
    # Omit to leave the realm's current setting untouched. Required before
    # the organizations block below can be used.
    # organizationsEnabled: true

    # Realm attributes. Keys and values support ${VAR} expansion.
    # These are MERGED over the realm's current attributes, so keys managed
    # outside this config are preserved. Omit the block to leave them alone.
    # attributes:
    #   frontendUrl: "https://id.example.com"

    # Step-up authentication: map ACR values to Levels of Authentication.
    # Written to the realm's acr.loa.map attribute; wins over an acr.loa.map
    # entry set manually under attributes. Levels must not be negative.
    # acrLoaMap:
    #   silver: 1
    #   gold: 2

    # Authentication flows are created before clients, so a client below can
    # bind to a flow defined here. Flows are CREATE-ONLY: an existing alias is
    # left untouched whatever the strategy. To change a flow, delete it in
    # Keycloak or use a new alias. Declaring a built-in flow (browser, direct
    # grant, ...) is rejected — use copyFrom to derive your own instead.
    # authenticationFlows:
    #   - alias: "browser-step-up"
    #     description: "Browser flow with LoA step-up"
    #     providerId: "basic-flow"   # or "form-flow"; default basic-flow
    #     copyFrom: "browser"        # seed from an existing flow
    #     executions:                # created in the order declared
    #       - subflow: "loa-gold"
    #         requirement: "CONDITIONAL"
    #         executions:
    #           - provider: "conditional-level-of-authentication"
    #             requirement: "REQUIRED"
    #             config:
    #               alias: "gold-condition"   # names the config itself
    #               loa-condition-level: "2"
    #           - provider: "auth-otp-form"
    #             requirement: "REQUIRED"

    # Realm-level flow bindings, by alias. Applied after the flows exist.
    # Unset bindings are left alone.
    # authenticationBindings:
    #   browserFlow: "browser-step-up"

    # Client scopes are provisioned before clients, so a client below can
    # reference a scope defined here. Matched by name.
    # clientScopes:
    #   - name: "orders:read"
    #     description: "Read access to orders"
    #     protocol: "openid-connect"   # default when omitted
    #     type: "optional"             # "default", "optional", or "none" (default)
    #     attributes:
    #       "include.in.token.scope": "true"
    #     protocolMappers:
    #       - name: "orders-audience"
    #         protocol: "openid-connect"
    #         protocolMapper: "oidc-audience-mapper"
    #         config:
    #           "included.client.audience": "orders-api"

    clients:
      - clientId: "my-app"
        secret: "${MY_APP_CLIENT_SECRET}"
        name: "My Application"
        enabled: true
        publicClient: false
        protocol: "openid-connect"
        rootUrl: "https://myapp.example.com"
        baseUrl: "/"
        adminUrl: "https://myapp.example.com"
        redirectUris:
          - "https://myapp.example.com/*"
        webOrigins:
          - "https://myapp.example.com"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        bearerOnly: false
        consentRequired: false
        frontchannelLogout: false
        defaultClientScopes:
          - "web-origins"
          - "profile"
        optionalClientScopes:
          - "offline_access"
        attributes:
          "post.logout.redirect.uris": "+"
        # Client-level ACR-to-LoA map for step-up authentication. Written to
        # the client's acr.loa.map attribute; wins over the raw attribute.
        # acrLoaMap:
        #   gold: 2
        # Override the realm flow bindings for this client. Values are flow
        # aliases, resolved to the flow IDs Keycloak stores on the client.
        # authenticationFlowBindingOverrides:
        #   browser: "browser-step-up"
        protocolMappers:
          - name: "audience-mapper"
            protocol: "openid-connect"
            protocolMapper: "oidc-audience-mapper"
            consentRequired: false
            config:
              "included.client.audience": "my-app"
              "id.token.claim": "true"
              "access.token.claim": "true"
        clientRoles:
          - name: "admin"
            description: "Administrator role"
          - name: "user"
            description: "Regular user role"

      # Service account client with role assignments
      # - clientId: "my-service"
      #   serviceAccountsEnabled: true
      #   serviceAccountRoles:
      #     realm:
      #       - app-admin
      #     clients:
      #       another-client:
      #         - some-role

      # Token exchange (RFC 8693) requester client.
      # Enables the OAuth 2.0 Token Exchange grant so this client can exchange
      # its access token for a token targeting another client in the realm.
      # Requires a confidential client (publicClient not true, not bearer-only)
      # and Keycloak 26.2+.
      # - clientId: "exchange-service"
      #   publicClient: false
      #   secret: "${EXCHANGE_SERVICE_SECRET}"
      #   standardTokenExchangeEnabled: true

    roles:
      - name: "app-admin"
        description: "Application administrator"
      - name: "app-user"
        description: "Application user"

    # User management
    # users:
    #   - username: "service-admin"
    #     password: "${SERVICE_ADMIN_PASSWORD}"    # permanent password, reset on every run
    #     enabled: true
    #     email: "admin@example.com"
    #     firstName: "Service"
    #     lastName: "Admin"
    #     emailVerified: true
    #     roles:
    #       realm:
    #         - app-admin
    #       clients:
    #         my-app:
    #           - admin
    #     # Group memberships by path (leading slash optional; additive —
    #     # never removed). Groups must exist or be defined under "groups"
    #     # below; a missing group is logged as a warning and skipped.
    #     groups:
    #       - "engineering"
    #       - "/engineering/backend"
    #
    #   # Use initialPassword instead of password for one-time setup.
    #   # Only set when the user is first created; ignored on subsequent runs.
    #   # The user must change the password on first login.
    #   - username: "new-user"
    #     initialPassword: "changeme"
    #     enabled: true
    #     email: "user@example.com"

    # Organizations are provisioned last, so members resolve to users defined
    # above. Requires organizationsEnabled: true. Membership is additive.
    # organizations:
    #   - name: "acme"
    #     alias: "acme"            # optional; Keycloak derives one when omitted
    #     enabled: true
    #     description: "ACME Corp"
    #     redirectUrl: "https://acme.example.com"
    #     domains:
    #       - name: "acme.com"
    #         verified: true
    #     attributes:
    #       tier:
    #         - "gold"
    #     members:
    #       - "service-admin"
    #     # Organization-scoped groups. These are NOT realm groups: they never
    #     # appear under the realm's groups and cannot be managed through the
    #     # normal group API. They support no role mappings, and members must
    #     # also be listed under the organization's members above.
    #     groups:
    #       - name: "engineering"
    #         attributes:
    #           tier:
    #             - "gold"
    #         members:
    #           - "service-admin"
    #         subGroups:
    #           - name: "backend"

    groups:
      - name: "engineering"
        # Group attributes are multivalued (list of strings per key).
        attributes:
          department:
            - "engineering"
        # Realm roles to grant the group (must exist / be defined above).
        realmRoles:
          - "app-admin"
        # Client roles to grant, keyed by clientId.
        clientRoles:
          my-app:
            - "admin"
        # Groups may nest arbitrarily deep via subGroups.
        subGroups:
          - name: "backend"
          - name: "frontend"
            realmRoles:
              - "app-user"
